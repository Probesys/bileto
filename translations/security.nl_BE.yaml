'An authentication exception occurred.': 'Er is een authenticatiefout opgetreden.'
'Authentication credentials could not be found.': 'Authenticatiegegevens konden niet worden gevonden.'
'Authentication request could not be processed due to a system problem.': 'Het authenticatieverzoek kon niet worden verwerkt vanwege een systeemprobleem.'
'Invalid credentials.': 'Ongeldige inloggegevens.'
'Cookie has already been used by someone else.': 'De cookie is al door iemand anders gebruikt.'
'Not privileged to request the resource.': 'U beschikt niet over de nodige rechten om deze bron op te vragen.'
'Invalid CSRF token.': 'Ongeldig CSRF-token.'
'No authentication provider found to support the authentication token.': 'Er is geen authenticatieprovider gevonden die het authenticatietoken ondersteunt.'
'No session available, it either timed out or cookies are not enabled.': 'Geen sessie beschikbaar; deze is verlopen of cookies zijn uitgeschakeld.'
'No token could be found.': 'Er kon geen token worden gevonden.'
'Username could not be found.': 'Gebruikersnaam kon niet worden gevonden.'
'Account has expired.': 'Het account is verlopen.'
'Credentials have expired.': 'De inloggegevens zijn verlopen.'
'Account is disabled.': 'Het account is gedeactiveerd.'
'Account is locked.': 'Het account is geblokkeerd.'
